<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellapp</title>
    <link rel="icon" href="/assets/img/favicon.svg" />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/global.css" />
    <!-- Scripts -->
    <script src="/script.js" defer></script>
  </head>
  <body>
    <header>
      <nav class="content-limitation">
        <div class="logo-container">
          <img src="/assets/img/favicon.svg" alt="app logo" />
          <span class="accent-font">Bestell App</span>
        </div>
        <button class="header-btn-mobile">
          <img
            src="/assets/img/shopping_cart_mobile.svg"
            alt="shopping cart mobile devices"
          />
        </button>
      </nav>
    </header>
    <main class="content-limitation">
      <section class="main-content">
        <!-- This is the main section of the page, the left section -->
        <section class="hero-top">
          <img
            class="hero-img-top"
            src="/assets/img/hero_img_main.jpg"
            alt="a pizza on a plate"
          />
          <img
            class="secondary-logo"
            src="/assets/img/hero_round_pizza_logo.jpg"
            alt="secondary logo, animation of a pizza"
          />
        </section>

        <section class="hero-bottom">
          <div class="title-container">
            <h1>Happy Pizza</h1>
            <span>Rewiews (4,5 stars)</span>
          </div>
          <div class="menu-navigation">
            <a href="#"> Pizza?</a>
            <a href="#"> Dessert?</a>
            <a href="#"> Drinks?</a>
          </div>
          <img class="hero-img-top" src="/assets/img/hero_img_secondary.jpg" alt="image of a pizza">
        </section>
      </section>
      <aside>
        <!-- This is  the basket, the right section -->

        <h2>Warenkorb</h2>
      </aside>
    </main>
    <footer></footer>
  </body>
</html>
